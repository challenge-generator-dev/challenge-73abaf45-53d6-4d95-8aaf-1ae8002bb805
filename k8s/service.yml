apiVersion: v1
kind: Service
metadata:
  name: container-app-service
  labels:
    app: container-app
spec:
  type: ClusterIP
  selector:
    app: container-app
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: container-app-nodeport
  labels:
    app: container-app
spec:
  type: NodePort
  selector:
    app: container-app
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP