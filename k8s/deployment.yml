apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-app
  labels:
    app: container-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: container-app
  template:
    metadata:
      labels:
        app: container-app
        version: v1
    spec:
      containers:
      - name: container-app
        image: container-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: container-app-config
              key: db.host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: container-app-config
              key: db.port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: container-app-config
              key: db.name
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: container-app-secret
              key: db.username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: container-app-secret
              key: db.password
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3